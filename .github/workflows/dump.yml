name: GitHub Repo Dump

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dump chunk
        env:
          DUMP_PAT: ${{ secrets.DUMP_PAT }}
        run: python scripts/github_full_dump.py

      - name: Install Drive upload dependencies
        run: pip install --quiet google-auth google-api-python-client

      - name: Upload new chunk to Google Drive
        continue-on-error: true
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          LATEST_FILE=$(ls -t data/*.jsonl | head -1)
          python scripts/upload_to_drive.py "$LATEST_FILE"

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ checkpoint.txt
          git diff --staged --quiet || git commit -m "Repo dump chunk $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

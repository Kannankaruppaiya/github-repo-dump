name: GitHub Repo Dump

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dump chunk
        env:
          DUMP_PAT: ${{ secrets.DUMP_PAT }}
        run: python scripts/github_full_dump.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ checkpoint.txt
          git diff --staged --quiet || git commit -m "Repo dump chunk $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
